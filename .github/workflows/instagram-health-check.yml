name: Instagram Health Check

# Safety net for the Vercel cron that refreshes the Instagram token
# (api/cron/refresh-instagram-token.js). Opens an issue if automatic refresh
# has stalled, the token is close to expiring, or the gallery API is failing,
# and closes it once healthy again.
#
# GitHub disables scheduled workflows after 60 days without repo activity, so
# every run re-enables this workflow to keep the schedule alive.
#
# Set the repo variable SITE_URL (Settings → Secrets and variables → Actions →
# Variables) if the site moves off the default Vercel URL below.

on:
  schedule:
    - cron: "0 16 * * 1" # Mondays
  workflow_dispatch:

permissions:
  issues: write
  actions: write # keepalive: re-enable this workflow on each run

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://detailing-site-lemon.vercel.app' }}
        with:
          script: |
            const site = process.env.SITE_URL.replace(/\/$/, "");
            const label = "instagram-health";
            const WARN_DAYS = 14; // days left before the token expires
            const STALE_DAYS = 10; // cron refreshes weekly; older means it's failing
            const problems = [];
            const { owner, repo } = context.repo;

            try {
              await github.rest.actions.enableWorkflow({
                owner, repo, workflow_id: "instagram-health-check.yml",
              });
            } catch (err) {
              core.warning(`Keepalive failed: ${err.message}`);
            }

            const getJson = async (path) => {
              try {
                const res = await fetch(`${site}${path}`);
                return { status: res.status, body: await res.json().catch(() => ({})) };
              } catch (err) {
                return { status: 0, body: { error: err.message } };
              }
            };

            const health = await getJson("/api/health");
            const { tokenStore, refreshedAt, expiresAt } = health.body;
            if (health.status !== 200) {
              problems.push(`\`/api/health\` returned ${health.status}: ${JSON.stringify(health.body)}`);
            } else if (tokenStore !== "connected") {
              problems.push("No Redis store is connected, so the token can't be refreshed automatically.");
            } else if (!expiresAt) {
              problems.push("The token has never been refreshed by the cron job yet.");
            } else {
              const daysLeft = (Date.parse(expiresAt) - Date.now()) / 86_400_000;
              const daysSince = (Date.now() - Date.parse(refreshedAt)) / 86_400_000;
              core.info(`Token refreshed ${refreshedAt}, expires ${expiresAt} (${daysLeft.toFixed(1)} days)`);
              if (daysLeft < WARN_DAYS) {
                problems.push(`The token expires in ${daysLeft.toFixed(1)} days (${expiresAt}).`);
              } else if (daysSince > STALE_DAYS) {
                problems.push(
                  `Automatic refresh has stalled: last refresh was ${daysSince.toFixed(0)} days ago ` +
                  `(${refreshedAt}). The token still works until ${expiresAt}, so there's time to fix it.`,
                );
              }
            }

            const posts = await getJson("/api/instagram");
            if (posts.status !== 200 || !posts.body.count) {
              problems.push(`\`/api/instagram\` returned ${posts.status} with ${posts.body.count ?? 0} posts.`);
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });

            if (problems.length === 0) {
              core.info("Healthy.");
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body: "Healthy again, closing.",
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: "closed",
                });
              }
              return;
            }

            core.warning(problems.join("\n"));
            if (open.length > 0) {
              core.info(`Issue #${open[0].number} already open.`);
              return;
            }

            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: "Instagram gallery needs attention",
              body: [
                `Weekly check of ${site} found:`,
                "",
                ...problems.map((p) => `- ${p}`),
                "",
                "### How to fix",
                "1. Check the cron logs: Vercel → Project → Settings → Cron Jobs → View Logs.",
                "2. Retry the refresh: `curl -H \"Authorization: Bearer $CRON_SECRET\" " + site + "/api/cron/refresh-instagram-token?force=1`",
                "3. If the token already expired, generate a new one (see README) and paste it into the `INSTAGRAM_ACCESS_TOKEN` env var on Vercel, then redeploy.",
              ].join("\n"),
            });
